[project]
name = "epub-to-audiobook"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.11.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "ebooklib>=0.18",
    "gradio>=4.0.0",
    "lxml>=4.9.0",
    "pandas>=2.0.0",
    "pypdf>=4.0.0",
    "requests>=2.31.0",
    "tqdm>=4.65.0",
    "indextts",
    "jsonschema>=4.0,<5",
    "numpy>=1.26,<2",
    "scipy>=1.11",
    "fastrlock==0.8.2",
    "cuquantum-python-cu12<25",
]

[project.optional-dependencies]
deepspeed = [
    "indextts[deepspeed]",
]
viz = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12",
    # qiskit powers the `vqc` substrate layer (QuantumGenerativeMap). It is
    # imported lazily, so the server stays importable without it; a `vqc`
    # run fails with a clear error when it is absent.
    "qiskit>=1.0",
]
viz-manim = ["manim>=0.18"]

[dependency-groups]
# Dev/test dependencies. uv installs these by default on `uv sync`.
# The qft_pcn test suite requires pytest + pytest-timeout (the timeout
# plugin is load-bearing — runaway MERA evolutions must be killable).
dev = [
    "pytest>=8",
    "pytest-timeout>=2",
]

[tool.uv.workspace]
members = [
    "lib/index-tts",
]

[tool.uv.sources]
indextts = { workspace = true }

[tool.pytest.ini_options]
markers = [
    "slow: Bundle-scale acceptance (opt-in via --runslow)",
]
